<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: white;
      background: linear-gradient(#333, #111);
    }

    section {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      position: absolute;
      top: 50px; /* below navbar */
      left: 0;
      width: 100%;
      min-height: calc(100vh - 50px);
    }

    section.active {
      opacity: 1;
      visibility: visible;
      position: relative;
    }

    nav {
      background:#111;
      height:50px;
      display:flex;
      justify-content:center;
      align-items:center;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      z-index:500;
    }

    nav a {
      color:white;
      text-decoration:none;
      margin:0 15px;
      cursor:pointer;
    }

    /* Keep your existing styles */
    .stats-box:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<!-- Navigation -->
<nav>
  <a data-target="home">Home</a>
  <a data-target="about">About</a>
  <a data-target="tiktok">TikTok</a>
  <a data-target="projects">Projects</a>
  <a data-target="achievements">Achievements</a>
  <a data-target="contact">Contact</a>
  <a data-target="skills">My Skills</a>
</nav>

<!-- Hero Section -->
<section id="home" class="hero active" style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px 20px;">
  <img src="prof.jpg" alt="Profile Image" style="width:150px; height:150px; border-radius:50%; background:#ccc; margin-bottom:25px;">
  <h1 style="font-size:2.5em; margin:10px 0;">Hi, I'm <span class="highlight">Roman Maque</span></h1>
  <h2 class="highlight" style="font-size:1.8em; margin:10px 0;">Video Editor & IT Specialist</h2>
  <p style="font-size:1.2em; margin:15px 0;">Crafting viral content and stunning edits.</p>
  <div class="hero-buttons" style="margin-top:20px;">
    <a data-target="projects" class="btn-primary" style="padding:12px 24px; background:#00aaff; color:white; border-radius:6px; text-decoration:none; margin:0 10px;">Projects</a>
    <a href="resume.pdf" download class="btn-secondary" style="padding:12px 24px; border:2px solid #00aaff; color:#00aaff; border-radius:6px; text-decoration:none; margin:0 10px;">Download CV</a>
  </div>

  <!-- Stats Section -->
  <div class="stats-section" style="display:flex; justify-content:center; gap:30px; padding:50px 20px; color:white; margin-top:40px;">
    <div class="stats-box" style="width:170px; height:170px; background:skyblue; border-radius:10px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <a data-target="tiktok" style="color:black; text-decoration:none; font-weight:bold;">
        <h3 style="margin:5px 0;">Viral TikToks</h3>
        <p style="margin:5px 0;">150M+ Views</p>
      </a>
    </div>
    <div class="stats-box" style="width:170px; height:170px; background:skyblue; border-radius:10px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <a data-target="skills" style="color:black; text-decoration:none; font-weight:bold;">
        <h3 style="margin:5px 0;">My Skills</h3>
      </a>
    </div>
    <div class="stats-box" style="width:170px; height:170px; background:skyblue; border-radius:10px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <a data-target="achievements" style="color:black; text-decoration:none; font-weight:bold;">
        <h3 style="margin:5px 0;">My Achievements</h3>
      </a>
    </div>
  </div>
</section>

<!-- About Section -->
<section id="about" class="about">
  <!-- your full About content here -->
</section>

<!-- TikTok Section -->
<section id="tiktok" class="tiktok">
  <!-- your full TikTok content here -->
</section>

<!-- Projects Section -->
<section id="projects" class="projects">
  <!-- your full Projects content here -->
</section>

<!-- Achievements Section -->
<section id="achievements" class="achievements">
  <!-- your full Achievements content here -->
</section>

<!-- Contact Section -->
<section id="contact" class="contact">
  <!-- your full Contact content here -->
</section>

<!-- Skills Section -->
<section id="skills" class="skills">
  <!-- your full Skills content here -->
</section>

<script>
  // SPA navigation logic
  const links = document.querySelectorAll('nav a, .stats-box a, .hero-buttons a');
  const sections = document.querySelectorAll('section');

  function showSection(id) {
    sections.forEach(sec => {
      if(sec.id === id) {
        sec.classList.add('active');
      } else {
        sec.classList.remove('active');
      }
    });
  }

  links.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const target = link.getAttribute('data-target');
      if(target) showSection(target);
    });
  });
</script>

</body>
</html>
